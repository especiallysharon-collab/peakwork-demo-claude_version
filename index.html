<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PeakWork interactive prototype · MC6378 Data Storytelling · synthetic demo data">
</head>
<body>
<title>PeakWork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: deck-matched app shell — lime-glow paper ground, black pill nav, white cards, dark measure chips */
:root{
  --bg:#F5F6EC; --glow:rgba(212,232,36,.30); --card:#FFFFFF; --card2:#F1F4E1; --line:#E1E4D3; --line2:#DCE3C0;
  --ink:#0C0D07; --muted:#5B5E52; --faint:#8D9180; --green:#31643B; --deep:#1E3A22; --lime:#D4E824; --lime-soft:#E9F0BE;
  --amber:#C9861B; --amber-soft:#FBEFD6; --danger:#A8432C; --danger-soft:#F8E3DC;
  --protect:#31643B; --protect-soft:#E3EEDF; --refuel:#B9CB10; --refuel-soft:#F1F6C4; --usewell:#0C0D07; --usewell-soft:#E6E7E0;
  --chip-bg:linear-gradient(100deg,#1E3A22,#0C0D07); --chip-fg:#FFFFFF;
  --nav:#0C0D07; --nav-fg:#F5F6EC;
  --shadow:0 1px 2px rgba(30,58,34,.06),0 8px 24px rgba(30,58,34,.06);
  --f-display:"Poppins","Figtree",Arial,sans-serif; --f-body:"Figtree",Arial,"Helvetica Neue",sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130D; --glow:rgba(212,232,36,.10); --card:#1A1D14; --card2:#20251A; --line:#2D3324; --line2:#3A4230;
  --ink:#EEF2DC; --muted:#B4B9A2; --faint:#8D9180; --green:#9BCB7A; --deep:#CFE6A8; --lime:#D4E824; --lime-soft:#2E3517;
  --amber:#E8B04F; --amber-soft:#3A2E16; --danger:#F09A84; --danger-soft:#3B211B;
  --protect:#9BCB7A; --protect-soft:#223321; --refuel:#D4E824; --refuel-soft:#2E3517; --usewell:#EEF2DC; --usewell-soft:#2A2D24;
  --chip-bg:linear-gradient(100deg,#2B4A2F,#161A10); --nav:#000000; --nav-fg:#EEF2DC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11130D; --glow:rgba(212,232,36,.10); --card:#1A1D14; --card2:#20251A; --line:#2D3324; --line2:#3A4230;
  --ink:#EEF2DC; --muted:#B4B9A2; --faint:#8D9180; --green:#9BCB7A; --deep:#CFE6A8; --lime:#D4E824; --lime-soft:#2E3517;
  --amber:#E8B04F; --amber-soft:#3A2E16; --danger:#F09A84; --danger-soft:#3B211B;
  --protect:#9BCB7A; --protect-soft:#223321; --refuel:#D4E824; --refuel-soft:#2E3517; --usewell:#EEF2DC; --usewell-soft:#2A2D24;
  --chip-bg:linear-gradient(100deg,#2B4A2F,#161A10); --nav:#000000; --nav-fg:#EEF2DC; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 380px at 50% -120px,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-body);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(24px,3.2vw,32px);line-height:1.15}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:14px} .xs{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.eyebrow.plain::before{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;flex:none}
.logo svg{width:44px;height:auto}
.logo b{color:var(--green);font-weight:800}
.badge-synth{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--lime-soft);color:var(--deep);white-space:nowrap}
.top .grow{flex:1}
.clockbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px}
.clockbtn .t{font-family:var(--f-display);font-size:15px}
.clockbtn .live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--lime-soft)}
.clockbtn .live.off{background:var(--faint);box-shadow:none}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--deep);color:var(--lime);font-weight:700;display:grid;place-items:center;flex:none}
.rolepill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px;background:var(--nav);border-radius:24px;padding:10px}
.side .lbl{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:10px 12px 4px}
.navbtn{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 14px;border-radius:999px;border:0;background:transparent;color:var(--nav-fg);font-weight:600;text-align:left;text-decoration:none;font-size:15px}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:rgba(255,255,255,.07)}
.navbtn[aria-current="page"]{background:var(--lime);color:#0C0D07}
.navbtn .k{margin-left:auto;font-size:11px;opacity:.6}
.side .sep{height:1px;background:rgba(255,255,255,.1);margin:6px 8px}
main{min-width:0;outline:none}
main:focus-visible{outline:none}
.bottom{display:none}
.foot{max-width:1240px;margin:0 auto;justify-content:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:16px 24px}
  .side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);padding:6px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
  .bottom .navbtn{flex-direction:column;gap:2px;min-height:54px;padding:6px 2px;border-radius:16px;font-size:11.5px;justify-content:center;text-align:center}
  .bottom .navbtn .k{display:none}
  .foot{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .badge-synth{display:none}
  .logo span.word{display:none}
}
@media (max-width:420px){ .clockbtn .lbl{display:none} }

/* page */
.page{display:flex;flex-direction:column;gap:20px}
.phead{display:flex;flex-direction:column;gap:8px}
.phead .sub{color:var(--muted);max-width:62ch}
.pillar-head{display:flex;gap:16px;align-items:center;padding:20px 22px;border-radius:var(--r);background:linear-gradient(120deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--line)}
.pillar-head .pic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.pillar-head .pic svg{width:28px;height:28px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card.soft{background:linear-gradient(160deg,var(--card) 30%,var(--lime-soft) 140%)}
.card.flat{box-shadow:none;background:var(--card2)}
.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* measure chip — deck motif */
.mchip{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);font-size:13px;font-weight:600;line-height:1.2;max-width:100%}
.mchip .n{width:24px;height:24px;border-radius:50%;background:var(--lime);color:#0C0D07;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.mchip small{display:block;font-size:10.5px;font-weight:500;opacity:.7}
.leads{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:999px;background:linear-gradient(90deg,var(--card2),var(--lime-soft))}
.leads .k{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--green);text-transform:uppercase}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.lime{background:var(--lime);color:#0C0D07}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
.btn.quiet{background:var(--card2);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13.5px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:auto}

/* tags & status */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--protect-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.lime{background:var(--lime);color:#0C0D07}
.tag.ink{background:var(--ink);color:var(--bg)}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 6px;border-radius:999px}
.ptag svg{width:15px;height:15px}
.ptag.protect{background:var(--protect-soft);color:var(--protect)}
.ptag.refuel{background:var(--refuel-soft);color:var(--ink)}
.ptag.use_well{background:var(--usewell-soft);color:var(--usewell)}

/* battery */
.battery{display:flex;align-items:center;gap:4px}
.battery .body{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;border:4px solid var(--ink);border-radius:14px;background:var(--card)}
.battery .cell{border-radius:5px;background:var(--line)}
.battery .cap{width:8px;height:40%;background:var(--ink);border-radius:0 4px 4px 0}
.battery .cell.on{background:var(--lime)}
.battery.low .cell.on{background:var(--amber)}
.battery.empty .body{border-style:dashed;border-color:var(--faint)}
.battery.empty .cap{background:var(--faint)}
.battery.lg .body{width:min(320px,70vw);height:110px}
.battery.md .body{width:132px;height:52px;border-width:3px;padding:4px;gap:3px;border-radius:10px}
.battery.sm .body{width:44px;height:20px;border-width:2px;padding:2px;gap:2px;border-radius:5px}
.battery.sm .cell{border-radius:2px}
.battery .q{display:grid;place-items:center;grid-column:1/-1;font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--faint)}
.battery.charging .cell.next{animation:charge 1.1s ease-in-out infinite}
@keyframes charge{0%,100%{background:var(--line)}50%{background:var(--lime)}}
@media (prefers-reduced-motion:reduce){.battery.charging .cell.next{animation:none}}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:26px;border-radius:24px;background:linear-gradient(135deg,var(--card) 35%,var(--lime-soft));border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .state{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.05}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:18px;padding:20px}}

.sugg{border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--card)}
.sugg .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.sugg .ic svg{width:24px;height:24px}
.sugg .tx{flex:1;min-width:200px}
.bg-protect{background:var(--protect);color:#fff} .bg-refuel{background:var(--lime);color:#0C0D07} .bg-use_well{background:#0C0D07;color:var(--lime)}

.pcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(170deg,var(--card) 40%,var(--card2));box-shadow:var(--shadow);color:var(--ink)}
.pcard:hover{border-color:var(--green)}
.pcard .top2{display:flex;justify-content:space-between;align-items:center}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;width:104px;flex:none}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=number],select,textarea{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:16px;width:100%}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.seg label{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.seg [aria-pressed="true"],.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg label{position:relative;cursor:pointer}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--lime)}
.err{color:var(--danger);font-size:13.5px;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:21px}

/* rating picker */
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13px}
.rate button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--lime-soft)}

/* banner */
#banner-root{position:sticky;top:calc(65px + env(safe-area-inset-top,0px));z-index:19}
.nudge{max-width:1240px;margin:10px auto 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:18px;background:var(--chip-bg);color:#fff;box-shadow:0 12px 30px rgba(12,13,7,.25);width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)))}
.nudge .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.nudge .tx{flex:1;min-width:200px}
.nudge .tx small{display:block;opacity:.75;font-size:12.5px}
.nudge .btn.ghost{border-color:rgba(255,255,255,.3);color:#fff}
.nudge .linkbtn{color:var(--lime)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,13,7,.45);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.xbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:20px;line-height:1;flex:none}

/* fullscreen activity */
.activity{position:fixed;inset:0;z-index:60;background:radial-gradient(900px 500px at 50% 0%,rgba(212,232,36,.25),transparent 70%),#0C0D07;color:#F5F6EC;display:flex;align-items:center;justify-content:center;padding:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.activity .in{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.activity .count{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,14vw,112px);line-height:1;font-variant-numeric:tabular-nums;color:var(--lime)}
.activity .battery .body{background:#1A1D14;border-color:#F5F6EC;width:200px;height:76px}
.activity .battery .cap{background:#F5F6EC}
.activity .battery .cell{background:#2D3324}
.activity .battery .cell.on{background:var(--lime)}
.activity .note{font-size:13px;opacity:.75;max-width:48ch}
.activity .alts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.activity .alts button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.activity .alts button[aria-pressed="true"]{background:var(--lime);color:#0C0D07}

/* toast */
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.bad{background:var(--danger);color:#fff}

    const ap = p === "use_well" ? S.planApplies.filter(a => dates.includes(a.date)) : [];
    const people = new Set([...hs.map(h => h.emp), ...bs.map(b => b.emp), ...ap.map(a => a.emp)]);
    out[p] = { people: people.size, actions: hs.length, bookings: bs.length, used: bs.filter(b => b.status === "completed").length, applies: ap.length, byMeasure: {} };

/* ================= reminder engine ================= */
function syncReminders(trigger = "clock") {
  const emp = me(); if (S.view.role !== "employee" || readOnly) return;
  const rs = S.reminders[emp], pl = plan(emp), now = CLOCK.sec, nm = Math.floor(now / 60);
  let changes = [];
  const busy = Object.values(rs).some(r => r.status === "shown" || r.status === "in_progress");
  const due = [];
  for (const [type, r] of Object.entries(rs)) {
    const iv = P(emp).reminders[type];
    if (!iv || r.pausedToday) continue;
    if (!["scheduled", "snoozed"].includes(r.status) || now < r.due) continue;
    if (nm >= pl.end) { changes.push([type, { status: "expired" }]); continue; }
    const blk = blockingAt(emp, nm);
    if (blk) { changes.push([type, { due: blk.end * 60 }]); continue; }
    if (nm >= pl.lunch[0] && nm < pl.lunch[1]) { changes.push([type, { due: pl.lunch[1] * 60 }]); continue; }
    due.push(type);
  }
  if (!busy && due.length) {
    const first = due.includes("move_timer") ? "move_timer" : due[0];
    changes.push([first, { status: "shown", shownSec: now }]);
    for (const t of due) if (t !== first) changes.push([t, { due: now + 300 }]);
  }
  // buddy auto-replies (demo partner accepts after 2 logical minutes)
  const pend = S.buddies.filter(b => b.from === emp && b.status === "pending" && now - b.sentSec >= 120);
  if (!changes.length && !pend.length) return false;
  const res = run("sync_reminders", d => {
    for (const [t, ch] of changes) Object.assign(d.reminders[emp][t], ch);
    for (const b of pend) { const x = d.buddies.find(y => y.id === b.id); x.status = "accepted"; d.blocks.push({ id: uid("k"), emp, date: TODAY, start: x.start, end: x.start + 30, kind: "buddy", title: (x.type === "lunch" ? "Lunch with " : "Move with ") + empName(x.to), system: false }); }
  }, { user: false });
  if (res.ok) {
    for (const [t, ch] of changes) if (ch.status === "shown") track("reminder_shown", { reminder_type: t, trigger: S.reminders[emp][t].trigger || "clock" });
    for (const b of pend) toast(`${empName(b.to)} accepted your ${b.type === "lunch" ? "lunch" : "movement"} invite.`);
    render();
  }
  return true;
}

    ${[540, 660, 780, 900, 1020].map(m => `<text x="${x(m)}" y="${H - 6}" text-anchor="middle">${hm(m)}</text>`).join("")}

function flexImpact(start, emp = me()) {
  const pr = P(emp), end = start + pr.paidMin + pr.lunchMin, core = S.company.core, notes = [];
  if (start > core[0] || end < core[1]) return { error: `Your day must cover core hours ${hm(core[0])}–${hm(core[1])}.`, notes };
  const pl = plan(emp);
  const bk = blocksToday(emp).find(b => b.kind === "booking" && !b.online && (b.start < start || b.end > end));
  if (bk) return { error: `Your booking "${bk.title}" (${hm(bk.start)}–${hm(bk.end)}) falls outside ${hm(start)}–${hm(end)}. Cancel it first.`, notes, locate: "classes" };
  if (pl.lunch[0] < start || pl.lunch[1] > end) return { error: "Your lunch break would fall outside your workday.", notes };
  const man = S.blocks.find(b => b.emp === emp && b.date === TODAY && b.kind === "focus" && (b.start < start || b.end > end));
  if (man) return { error: `Your focus block "${man.title}" falls outside the new hours.`, notes };
  S.blocks.filter(b => b.emp === emp && b.date === TODAY && b.kind === "meeting" && (b.start < start || b.end > end)).forEach(b => notes.push(`"${b.title}" stays at ${hm(b.start)} even though it is outside your hours.`));
  const sys = S.blocks.filter(b => b.emp === emp && b.date === TODAY && b.kind === "task" && b.system && (b.start < start || b.end > end));
  if (sys.length) notes.push(pr.followEnergy ? `${sys.length} task block(s) will be re-planned around your energy.` : `${sys.length} task block(s) fall outside and will be re-planned.`);
  notes.push("Fixed meetings, lunch and bookings do not move.");
  return { error: null, notes };
}

    const id = uid("e"); d.energyLogs.push({ id, emp, date: TODAY, min: Math.floor(CLOCK.sec / 60), rating, tags, source, token }); return { id };
  });
}
function startSession(d, emp, type, templateId) {
  const r = d.reminders[emp][type], t = TEMPLATES.find(x => x.id === templateId);
  Object.assign(r, { status: "in_progress", templateId, startedSec: CLOCK.sec, endSec: CLOCK.sec + t.sec });
}
function cmdStartActivity(type, src) {

  if (!c) { toast("No activity fits your settings right now.", "bad"); return; }
  const other = Object.entries(S.reminders[me()]).find(([k, r]) => k !== type && ["shown", "in_progress"].includes(r.status));
  if (other) { toast(`Finish or skip the current ${REM[other[0]].label} first.`, "bad"); return; }
  const res = run("start_activity", d => { const emp = ensureEmp(d); startSession(d, emp, type, c.id); });
  if (res.ok) { UI.actFocused = false; track("reminder_action", { action: "start", reason_code: src || "manual", reminder_type: type }); if (src === "battery") track("battery_suggestion_clicked", { pillar: REM[type].pillar }); render(); }
}
function cmdRem(type, action) {

    const emp = ensureEmp(d), r = d.reminders[emp][type];
    if (action === "start") { const c = candidates(type)[0]; if (!c) throw new BizErr("NO_ACTIVITY", "No activity fits right now."); startSession(d, emp, type, c.id); }
    if (action === "later") Object.assign(r, { status: "snoozed", due: CLOCK.sec + 600 });
    if (action === "skip") Object.assign(r, { status: "scheduled", due: CLOCK.sec + iv, anchor: CLOCK.sec, trigger: null });
    if (action === "pause") Object.assign(r, { status: "scheduled", pausedToday: true, trigger: null });
    if (action === "stop") Object.assign(r, { status: "scheduled", due: CLOCK.sec + iv, anchor: CLOCK.sec, templateId: null, endSec: null, trigger: null });
  });
  if (res.ok) { UI.actFocused = false; track("reminder_action", { action: action === "stop" ? "skip" : action, reason_code: action === "stop" ? "exited_early" : "user", reminder_type: type }); render(); if (action === "later") toast("OK. We'll check back in 10 minutes."); if (action === "pause") toast(`${REM[type].label} paused until tomorrow.`); }
  else if (res.message) toast(res.message, "bad");
}

function cmdTrigger(type) {

  if (!res.ok) { toast(res.message || "Could not trigger.", "bad"); return; }

function cmdBook(id, token, unknownOk) {
  const r = S.resources.find(x => x.id === id);
  track("booking_attempted", { resource_type: r.kind, slot_id: id, flow_id: token });
  const res = run("book", d => {
    const emp = ensureEmp(d);
    const ex = d.bookings.find(b => b.token === token);
    if (ex) { if (ex.emp !== emp || ex.resId !== id) throw new BizErr("REQUEST_CONFLICT", "This request was already used."); return { dup: true }; }
    const ev = evalResource(d.resources.find(x => x.id === id), emp);
    if (ev.mine) throw new BizErr("ALREADY_BOOKED", "You already have this booking.");
    if (!ev.ok) throw new BizErr(ev.reasons[0].code, ev.reasons[0].text);
    if (ev.priceUnknown && d.prefs[emp].budget != null && !unknownOk) throw new BizErr("PRICE_UNCONFIRMED", "Confirm that you accept an unconfirmed price.");
    const rr = d.resources.find(x => x.id === id);
    d.bookings.push({ id: uid("b"), emp, resId: id, date: TODAY, status: "confirmed", kind: rr.kind, pillar: rr.pillar, token, createdSec: CLOCK.sec, snapshot: { title: rr.title, start: rr.start, end: rr.end, price: ev.cost, location: rr.location, policy: { cancelBy: rr.cancelBy, subsidy: d.company.subsidy.on ? d.company.subsidy.amount : 0 } } });
  });
  if (res.ok) { track("booking_succeeded", { resource_type: r.kind, slot_id: id, flow_id: token }); closeModal(true); render(); toast(`${r.kind === "meal" ? "Reserved" : "Booked"}: ${r.title} at ${hm(r.start)}. Added to your plan.`); }
  else { track("booking_failed", { resource_type: r.kind, slot_id: id, error_code: res.code, flow_id: token }); if (UI.modal) { UI.modal.error = res.message || "Not saved. Please try again."; UI.modal.busy = false; renderModal(); } }
}

function cmdApplyPlan() {

  const res = run("apply_plan", d => {
    const emp = ensureEmp(d), fresh = buildPreview(emp, d);

  else if (!res.ok && res.message) toast(res.message, "bad");
}

  allow: el => { const res = run("policy", d => { d.company.allowancePerQuarter = +el.value; }, { role: "manager" }); if (res.ok) { track("policy_saved", { changed_keys: ["allowance"] }); toast("Policy saved."); } render(); },

function copyText(t, ok, fallbackEl) { try { navigator.clipboard.writeText(t).then(ok, () => { fallbackEl?.select?.(); toast("Select the text and copy it with your keyboard.", "bad"); }); } catch { fallbackEl?.select?.(); toast("Select the text and copy it with your keyboard.", "bad"); } }
const CHANGE_ACTS = new Set(["rem-toggle", "unk", "avail", "illus", "flex-pick", "follow", "rc-show", "buddy-opt", "emp", "cap", "price", "sub-on", "sub-amt", "allow"]);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (CHANGE_ACTS.has(a)) return;
  if (a === "rc" && el.tagName === "SELECT") return;
  if (el.tagName === "A") e.preventDefault();
  if (el.disabled) return;
  if (a === "scrim") { ACT.scrim(el, e); return; }
  ACT[a]?.(el, e);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (CHANGE_ACTS.has(a) || (a === "rc" && el.tagName === "SELECT")) ACT[a](el, e);
});
document.addEventListener("input", e => {
  const b = e.target.dataset?.bind; if (!b) return;
  const [root, ...path] = b.split("."); let o = root === "modal" ? UI.modal : UI[root];
  if (root === "modal") { UI.modal.dirty = true; }
  const k = path.pop(); for (const p of path) o = o[p]; o[k] = e.target.value;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "addtask") {
    const dt = UI.draftTask, title = dt.title.trim();
    if (!title) { toast("Give the task a short name.", "bad"); $("#task-title")?.focus(); return; }
    const res = run("add_task", d => { const e2 = ensureEmp(d); const n = d.tasks.filter(t => t.emp === e2 && t.date === TODAY).length; if (n >= 20) throw new BizErr("LIMIT", "Up to 20 tasks a day."); d.tasks.push({ id: uid("task"), emp: e2, date: TODAY, title, type: dt.type, dur: dt.dur, order: Date.now() }); });
    if (res.ok) { UI.draftTask = { title: "", type: "deep", dur: 45 }; render(); const pv = buildPreview(); const counts = {}; pv.items.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1); track("energy_plan_previewed", { task_type_counts: counts, moved_block_count: pv.moved }); const it = pv.items.find(i => i.title === title); toast(it?.start != null ? `Preview: ${title} at ${hm(it.start)}–${hm(it.end)} · ${it.reason}` : "No available slot today for that task."); }
    else if (res.message) toast(res.message, "bad");
  }
  if (f === "settings") {
    const fd = new FormData(e.target), errEl = $("#settings-err");
    const target = fd.get("target") === null ? P().target : fd.get("target") === "" ? null : +fd.get("target");
    if (target != null && (!Number.isInteger(target) || target < 1 || target > 20)) { errEl.textContent = "Daily target must be a whole number from 1 to 20, or empty."; $("#s-target").focus(); return; }
    const budget = fd.get("budget") === "" ? null : +fd.get("budget");
    if (budget != null && (isNaN(budget) || budget < 0)) { errEl.textContent = "Budget must be 0 or more, or empty."; return; }
    const pos = fd.getAll("pos"); if (!pos.length) { errEl.textContent = "Choose at least one posture."; return; }
    const res = run("settings", d => { const e2 = ensureEmp(d), p = d.prefs[e2]; const pl = d.plans[e2 + "|" + TODAY];
      if (!pl.locked) { p.target = target; pl.target = target; }
      p.focusWindow = String(fd.get("focus")).split(",").map(Number); p.budget = budget; p.softTags = fd.getAll("soft"); p.strictTags = fd.getAll("strict");
      p.activity = { ...p.activity, positions: pos, space: fd.get("space"), maxSec: +fd.get("max"), avoid: fd.getAll("avoid"), equipment: ["none", ...fd.getAll("eq")] };
      for (const t of Object.keys(REM)) { const v = +fd.get(t); if (v !== p.reminders[t]) { p.reminders[t] = v; Object.assign(d.reminders[e2][t], { status: "scheduled", due: CLOCK.sec + v * 60, anchor: CLOCK.sec, pausedToday: false }); } } });
    if (res.ok) { errEl.textContent = ""; track("settings_saved", { changed_keys: ["target", "focus", "budget", "tags", "activity", "reminders"] }); render(); toast("Preferences saved."); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (UI.modal && UI.modal.kind !== "corrupt") { closeModal(); e.preventDefault(); } }
  if (e.key === "Tab" && (UI.modal || activeSession())) {
    const root = UI.modal ? $("#modal-root .modal") : $(".activity"); if (!root) return;
    const f = [...root.querySelectorAll("button:not([disabled]),input:not([disabled]),select,textarea,a[href]")]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
  }
});
window.addEventListener("popstate", () => { const r = readRoute(); if (r) { UI.route = r; render(); } });
window.addEventListener("storage", e => {
  if (e.key !== KEY) return;
  readOnly = true;
  if (!$(".readonly-bar")) { const b = document.createElement("div"); b.className = "readonly-bar"; b.innerHTML = `This demo changed in another tab. View only until you reload. <button class="btn primary sm" onclick="location.reload()">Reload</button>`; document.body.appendChild(b); }
});

/* ================= clock ================= */
function advance(sec) {
  CLOCK.sec = Math.min(CLOCK.sec + sec, 86399); saveClock();
  syncReminders(); render();
  if (UI.modal?.kind === "demo") { const t = $("#demo-clock-t"); if (t) t.textContent = `${hms(CLOCK.sec)}:${pad(Math.floor(CLOCK.sec % 60))}`; }
}
let lastT = performance.now(), lastSync = 0, lastSave = 0, lastMin = -1;
function loop(t) {
  const dt = (t - lastT) / 1000; lastT = t;
  if (!CLOCK.paused && document.visibilityState === "visible" && dt < 2 && S) {
    CLOCK.sec = Math.min(CLOCK.sec + dt, 86399);
    const ct = $("#clock-t"); if (ct) ct.textContent = hms(CLOCK.sec);
    const dc = $("#demo-clock-t"); if (dc) dc.textContent = `${hms(CLOCK.sec)}:${pad(Math.floor(CLOCK.sec % 60))}`;
    tickActivity();
    if (CLOCK.sec - lastSync >= 15) { lastSync = CLOCK.sec; syncReminders(); }
    if (t - lastSave > 5000) { lastSave = t; saveClock(); }
    const m = Math.floor(CLOCK.sec / 60);
    if (m !== lastMin) { lastMin = m; if (lastMin >= 0 && !UI.modal && !activeSession() && !document.activeElement?.matches?.("input,select,textarea")) renderMain(); }
  }
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { lastT = performance.now(); if (document.visibilityState !== "visible") saveClock(); });

/* ================= boot ================= */
function boot() {
  loadAll();
  const r = readRoute();
  UI.route = r || (S.view.role === "manager" ? "/admin/outcomes" : "/today");
  if (UI.route.startsWith("/admin") !== (S.view.role === "manager")) UI.route = S.view.role === "manager" ? "/admin/outcomes" : "/today";
  lastSync = CLOCK.sec; lastMin = Math.floor(CLOCK.sec / 60);
  render();
  track("page_view", { route_id: UI.route });
  if (corrupt) openModal({ kind: "corrupt" });
  else if (S.view.role === "employee" && !P().onboarded) openModal({ kind: "onboard", a: {} });
  syncReminders();
  requestAnimationFrame(loop);
}
boot();

</script>
